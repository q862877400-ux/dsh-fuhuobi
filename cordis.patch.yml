# dsh-fuhuobi: 一键复活插件。通过备份制造复活币，启动失败时双击复活币即可恢复。
- insert:
    - id: fuhuobi
      name: 'dsh-fuhuobi'

# 兼容 dsh-desktop-launcher（@linxin666/dsh-web-ui-all 全家桶子插件）：
# 把桌面启动器的「dsh 命令」指向本插件的守护启动包装脚本，让桌面图标
# 双击即走 boot-guard 守护启动（启动前快照 → 健康检查 → 自动存复活币）。
# 仅当 loader 中存在 web-ui-desktop-launcher 行时生效；未装该插件时静默忽略。
# 注意：!!js 表达式运行在 ESM 环境（无 require 全局），只能使用 process 等全局。
- id: web-ui-desktop-launcher
  config:
    dshCommand: !!js |
      (() => {
        const home = process.env.DSH_HOME
        const base = home && home.trim() !== '' ? home.trim() : ((process.env.USERPROFILE || process.env.HOME || '') + '/.dsh')
        return base + '/profiles/web/node_modules/dsh-fuhuobi/scripts/guard-launcher.ps1'
      })()
